<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sign Up</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #667eea, #764ba2);
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .wrapper {
      display: flex;
      max-width: 800px;
      width: 100%;
      background: white;
      border-radius: 1rem;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
      overflow: hidden;
      animation: fadeIn 1s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .signup-container {
      flex: 1;
      padding: 2rem;
    }

    .image-side {
      flex: 1;
      background: url(signup_pic.png) no-repeat center center;
      background-size: cover;
      animation: slideIn 1s ease-in-out;
    }

    @keyframes slideIn {
      from { transform: translateX(100%); opacity: 0; }
      to { transform: translateX(0); opacity: 1; }
    }

    form h2 {
      text-align: center;
      color: #333;
      margin-bottom: 20px;
    }

    input[type="email"],
    input[type="password"] {
      width: 100%;
      padding: 10px;
      margin-bottom: 12px;
      border: 1px solid #ccc;
      border-radius: 6px;
    }

    button {
      width: 100%;
      padding: 10px;
      background: #667eea;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.3s;
    }

    button:hover {
      background: #5a67d8;
    }

    .error-msg {
      color: red;
      font-size: 0.9em;
      text-align: center;
      margin-top: 10px;
    }

    .login-link {
      text-align: center;
      margin-top: 15px;
      font-size: 0.9em;
    }

    .login-link a {
      color: #6b46c1;
      text-decoration: none;
    }

    .login-link a:hover {
      text-decoration: underline;
    }

    @media (max-width: 768px) {
      .wrapper {
        flex-direction: column-reverse;
      }
      .image-side {
        height: 200px;
      }
    }
  </style>
</head>
<body>

  <div class="wrapper">
    <div class="signup-container">
      <form id="signupForm">
        <h2>Sign Up</h2>
        <input type="email" id="email" placeholder="Email" required />
        <input type="password" id="password" placeholder="Password" required />
        <button type="submit">Sign Up</button>
        <p class="error-msg" id="errorMsg"></p>
        <p class="login-link">Already have an account? <a href="index.html">Login</a></p>
      </form>
    </div>
    <div class="image-side"></div>
  </div>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

  <!-- Firebase Config + Init -->
  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBeJjoU3c7ztOxOeyQPt8h6tXRlLea2fkQ",
      authDomain: "login-page-task1.firebaseapp.com",
      projectId: "login-page-task1",
      storageBucket: "login-page-task1.appspot.com",
      messagingSenderId: "1009071307288",
      appId: "1:1009071307288:web:e2f7f84a5b8bb35641216d"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
  </script>

  <!-- Signup Logic -->
  <script>
    document.getElementById("signupForm").addEventListener("submit", function (e) {
      e.preventDefault();

      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;
      const errorBox = document.getElementById("errorMsg");

      auth.createUserWithEmailAndPassword(email, password)
        .then(userCredential => {
          alert("User created: " + userCredential.user.email);
          errorBox.textContent = "";
          // window.location.href = "index.html";
        })
        .catch(err => {
          console.error(err.message);
          errorBox.textContent = err.message;
        });
    });
  </script>

</body>
</html>
